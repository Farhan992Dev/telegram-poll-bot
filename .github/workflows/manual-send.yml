name: Manual Poll Send

on:
  workflow_dispatch:
    inputs:
      question_id:
        description: 'Question ID (optional, random if empty)'
        required: false
        type: string

jobs:
  send-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send Poll
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "
import os, json, asyncio, random
from aiogram import Bot
from aiogram.enums import ParseMode

with open('questions.json', 'r', encoding='utf-8') as f:
    questions = json.load(f)

qid = os.getenv('QUESTION_ID')
if qid:
    question = next((q for q in questions if str(q['id']) == qid), None)
    if not question:
        print(f'Question ID {qid} not found')
        exit(1)
else:
    question = random.choice(questions)

async def send():
    bot = Bot(token=os.getenv('BOT_TOKEN'), parse_mode=ParseMode.HTML)
    await bot.send_poll(
        chat_id=int(os.getenv('CHAT_ID')),
        question=question['text'],
        options=question['options'],
        is_anonymous=False,
        allows_multiple_answers=question.get('multiple_choice', True),
        type='regular'
    )
    await bot.session.close()

asyncio.run(send())
          "
        shell: bash