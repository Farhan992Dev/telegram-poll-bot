name: Weekly Poll

on:
  schedule:
    # دوشنبه صبح - انتخاب یکی:
    # تابستانی (مارس-سپتامبر): 06:00 UTC = 09:30 ایران
    # زمستانی (اکتبر-فوریه):  06:00 UTC = 10:30 ایران
    - cron: '0 6 * * 1'
    # برای 09:00 ایران تابستانی: '0 5 * * 1'
    # برای 10:00 ایران زمستانی:  '0 6 * * 1'
  workflow_dispatch:

jobs:
  send-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send Weekly Poll
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_poll.py